<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAuto 智能助手平台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/app.css?v=19" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">
      <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1A5CC8"/><stop offset="1" stop-color="#5B8DEF"/>
        </linearGradient></defs>
        <rect width="48" height="48" rx="13" fill="url(#bg)"/>
        <path d="M13 32V17l5.5 8L24 17v15" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="33" cy="19" r="3" fill="#fff"/>
        <path d="M33 23v9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>MAuto</span>
    </div>
    <div class="boot-bar"><i></i></div>
    <p>正在加载智能工作台…</p>
  </div>

  <div id="login" class="login hidden">
    <div class="login-bg"></div>
    <div class="login-card">
      <div class="login-brand">
        <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1A5CC8"/><stop offset="1" stop-color="#5B8DEF"/>
          </linearGradient></defs>
          <rect width="48" height="48" rx="13" fill="url(#lg)"/>
          <path d="M13 32V17l5.5 8L24 17v15" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="33" cy="19" r="3" fill="#fff"/>
          <path d="M33 23v9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>MAuto 智能助手平台</h1>
          <p>以对话为入口的一体化智能工作台</p>
        </div>
      </div>
      <div class="login-tabs">
        <button class="active" data-mode="login">登录</button>
        <button data-mode="register">注册</button>
      </div>
      <form id="login-form" class="login-form">
        <label>邮箱<input type="email" name="email" placeholder="you@example.com" autocomplete="username" required /></label>
        <label>密码<input type="password" name="password" placeholder="至少 6 位" autocomplete="current-password" required /></label>
        <label class="reg-only hidden">昵称<input type="text" name="nickname" placeholder="如何称呼你（可选）" /></label>
        <button class="btn primary block" type="submit" id="login-submit">登录</button>
      </form>
      <div class="login-divider"><span>或</span></div>
      <button class="btn ghost block" id="demo-login">使用演示账号体验（demo@mauto.ai / demo1234）</button>
      <p class="login-foot">V1.0 演示环境 · 数据存储在本机 SQLite</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sb-top">
        <a class="sb-logo" href="#/chat" title="MAuto 首页">
          <span class="sb-logo-mark">
            <svg viewBox="0 0 48 48" width="30" height="30" aria-hidden="true">
              <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1A5CC8"/><stop offset="1" stop-color="#5B8DEF"/>
              </linearGradient></defs>
              <rect width="48" height="48" rx="13" fill="url(#sg)"/>
              <path d="M13 32V17l5.5 8L24 17v15" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="33" cy="19" r="3" fill="#fff"/>
              <path d="M33 23v9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="sb-logo-text">MAuto</span>
        </a>
        <div class="sb-top-actions">
          <button class="icon-btn" id="new-chat-btn" title="新建会话（Ctrl/Cmd+Shift+O）" data-icon="plus"></button>
          <button class="icon-btn" id="collapse-btn" title="收起侧边栏" data-icon="panel"></button>
        </div>
      </div>

      <nav class="sb-nav" id="sb-nav"></nav>

      <div class="sb-recent" id="sb-recent"></div>

      <div class="sb-bottom">
        <button class="sb-user" id="user-btn">
          <span class="avatar" id="sb-avatar">演</span>
          <span class="sb-user-meta">
            <b id="sb-nickname">演示用户</b>
            <small id="sb-email">demo@mauto.ai</small>
          </span>
          <span class="sb-user-caret" data-icon="chevron"></span>
        </button>
        <div class="sb-bottom-links">
          <button class="sb-mini" id="settings-btn" data-icon="settings">设置</button>
          <button class="sb-mini" id="help-btn" data-icon="help">帮助与反馈</button>
        </div>
        <div class="sb-version">V1.0.0 <span class="dot-ok"></span></div>
      </div>
      <div class="sb-tooltip" id="sb-tooltip"></div>
    </aside>

    <main class="main" id="main">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu" id="mobile-menu" data-icon="menu" title="菜单"></button>
          <div class="topbar-title">
            <div class="crumb" id="crumb"></div>
            <h2 id="page-title">新聊天</h2>
          </div>
        </div>
        <div class="topbar-right">
          <button class="search-trigger" id="search-trigger">
            <span data-icon="search"></span>
            <span>搜索会话、消息、资讯…</span>
            <kbd>⌘K</kbd>
          </button>
          <div class="bell-wrap">
            <button class="icon-btn" id="bell-btn" data-icon="bell" title="通知中心">
              <span class="badge hidden" id="bell-badge">0</span>
            </button>
            <div class="dropdown notif-dropdown hidden" id="notif-dropdown"></div>
          </div>
          <button class="icon-btn" id="theme-btn" data-icon="spark" title="演示提示"></button>
        </div>
      </header>
      <section class="page" id="page"></section>
    </main>
    <div class="sidebar-mask" id="sidebar-mask"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="menu-root"></div>

  <script type="module" src="/static/js/app.js?v=19"></script>
</body>
</html>
